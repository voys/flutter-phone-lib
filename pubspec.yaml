name: flutter_phone_lib
description: Use VoIP in Flutter.
version: 1.0.14
repository: https://github.com/open-voip-alliance/flutter-phone-lib

environment:
  flutter: ">=3.47.0"
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  equatable: ^3.0.0
  meta: ^1.16.0
  json_annotation: ^4.12.0
  freezed_annotation: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  freezed: ^4.0.3
  json_serializable: ^6.15.2

flutter:
  plugin:
    platforms:
      android:
        package: org.openvoipalliance.flutterphonelib
        pluginClass: PhoneLib
      ios:
        pluginClass: PhoneLibPlugin