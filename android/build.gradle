buildscript {
    ext.kotlin_version = '1.8.20'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.0.4'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

group 'org.openvoipalliance.flutterphonelib'
version '1.0-SNAPSHOT'

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        maven { url 'https://download.linphone.org/maven_repository/' }
    }
}

apply plugin: 'com.android.library'

android {
    namespace "org.openvoipalliance.flutterphonelib"
    compileSdk 36

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
    }

    defaultConfig {
        minSdkVersion 26
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        disable 'InvalidPackage'
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                // Shared with the Dart and iOS tests.
                systemProperty 'contractDir', file('../test/contract').absolutePath
                // Also at --quiet, which tool/test.sh uses to hide the build log.
                testLogging {
                    [lifecycle, quiet].each {
                        it.events 'passed', 'skipped', 'failed'
                        it.exceptionFormat 'full'
                    }
                }
            }
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    api "com.google.firebase:firebase-messaging:21.0.1"
    api "com.google.firebase:firebase-messaging-ktx:21.0.1"

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.3.9'
    implementation 'com.google.code.gson:gson:2.8.9'
    implementation project(':shared_secure_storage')

    // Dependencies of the vendored Android Phone Integration Lib (formerly
    // com.github.open-voip-alliance:Android-Phone-Integration-Lib).
    implementation 'org.linphone.minimal:linphone-sdk-android:5.5.35'
    implementation 'io.insert-koin:koin-android:2.2.2'
    implementation 'androidx.core:core-ktx:1.7.0'
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'androidx.media:media:1.2.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.4.0'
    implementation 'androidx.lifecycle:lifecycle-process:2.5.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'io.mockk:mockk:1.13.13'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
